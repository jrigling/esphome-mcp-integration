name: Publish to PyPI

# PyPI publishing is decoupled from GitHub Releases so that GitHub Releases can
# be used for the HACS *integration* version. The client library publishes only
# on a dedicated tag (e.g. `client-v0.1.1`) or a manual run.
on:
  push:
    tags:
      - "client-v*"
  workflow_dispatch:  # Allow manual trigger

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload --skip-existing dist/*
