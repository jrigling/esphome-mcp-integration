name: Test Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check esphome_mcp_client tests

      - name: Pytest (unit; integration smoke tests run in smoke-test.yml)
        run: pytest -m "not integration"

  ha-setup:
    name: HA setup smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Home Assistant + package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # homeassistant.helpers.llm imports the conversation component, whose
          # deps (hassil, intents) aren't pulled by the base homeassistant pkg.
          pip install homeassistant hassil home-assistant-intents

      - name: Import + setup smoke test
        run: pytest tests/ha -v

  build:
    name: Test package build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Test install
        run: pip install dist/*.whl
